# Context-length axis of the measured envelope, log-spaced 256 -> model max.
#
#   sbatch slurm/run_sweep.sh configs/envelope_len.yaml
#
# The prediction under test: the KV pool is sized by memory profiling and is
# therefore almost independent of max_model_len, so the *pool* should be roughly
# flat across this axis while *max concurrency* (pool / max_model_len) falls as
# 1/L. If the pool is not flat, the profile run's activation peak is scaling with
# max_num_batched_tokens, which is itself derived from max_model_len, and that is
# a named residual term rather than noise.
#
# 32768 is Qwen2.5-7B's max_position_embeddings, read from its config.json at
# revision a09a35458c702b33eeacc393d103063234e8bc28.
name: envelope-len

repetitions: 3
warmup_repetitions: 1

models:
  Qwen/Qwen2.5-7B-Instruct:
    path: /mnt/tier2/project/p201362/ttahmid/inference-work/hf_cache/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28
    revision: a09a35458c702b33eeacc393d103063234e8bc28

model: Qwen/Qwen2.5-7B-Instruct

engine:
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  block_size: 16
  kv_cache_dtype: auto
  dtype: bfloat16
  tensor_parallel_size: 1
  enable_prefix_caching: false
  seed: 0
  port: 8100

axes:
  max_model_len: [256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
